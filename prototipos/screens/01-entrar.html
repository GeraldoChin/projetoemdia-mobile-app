<!DOCTYPE html>
<!--
  ECRÃ 01 — Entrar / Criar Conta
  Tipo Stitch: mobile_blank (ecrã isolado, sem barra inferior)
  Captura: ../screenshots/01-entrar.png
  Interacção: alternar Entrar/Criar Conta, mostrar/ocultar palavra-passe, faixa de sucesso ao submeter
-->
<html lang="pt"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="../design/base.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../design/tailwind-config.js"></script></head>
<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface px-margin flex-1"><div class="flex flex-col w-full pb-16">
<!-- Marca -->
<div class="flex flex-col items-center text-center pt-4 pb-6">
<div class="relative w-16 h-16 rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-center mb-3">
<img alt="ProjetoEmDia Logo" class="w-12 h-12 object-contain" src="../assets/logo.svg"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">ProjetoEmDia</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[260px] mt-1">Gestão ágil para os seus projectos e tarefas</p>
</div>
<!-- Controlo segmentado -->
<div class="w-full bg-surface-container-high p-1 rounded-full flex relative mb-6">
<button class="flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center z-10 bg-primary-container text-on-primary shadow-sm" id="tab-login" onclick="switchAuthMode('login')" type="button">Entrar</button>
<button class="flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center z-10 text-on-surface-variant hover:text-on-surface" id="tab-register" onclick="switchAuthMode('register')" type="button">Criar Conta</button>
</div>
<!-- Cartão de autenticação -->
<div class="w-full bg-surface-container-lowest rounded-xl p-5 shadow-sm space-y-4">
<form class="space-y-4" id="auth-form" onsubmit="handleAuthSubmit(event)">
<!-- Nome (só no registo) -->
<div class="hidden flex-col space-y-1.5 transition-all" id="field-name-container">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="field-name">Nome Completo</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-3.5 py-3">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">person</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="field-name" name="name" placeholder="Mário Chissano" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="field-email">Email Profissional</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-3.5 py-3">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">mail</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="field-email" name="email" placeholder="exemplo@empresa.co.mz" required="" type="email"/>
</div>
</div>
<!-- Palavra-passe -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="field-password">Palavra-passe</label>
<a class="font-label-md text-label-md text-secondary hover:underline" href="#" id="forgot-password-link">Esqueceu a palavra-passe?</a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-3.5 py-3">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">lock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="field-password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Ver palavra-passe" class="text-outline hover:text-on-surface flex items-center justify-center p-1 focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Lembrar de mim (login) -->
<div class="flex items-center justify-between pt-1" id="remember-row">
<label class="flex items-center space-x-2.5 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary-container focus:ring-0 accent-primary-container cursor-pointer" id="remember-me" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Lembrar de mim</span>
</label>
<span class="inline-flex items-center text-label-sm font-label-sm bg-secondary-fixed text-on-secondary-fixed px-2 py-0.5 rounded-full">Seguro • SSL</span>
</div>
<!-- Termos (registo) -->
<div class="hidden items-start space-x-2 pt-1" id="terms-row">
<input class="mt-0.5 w-4 h-4 rounded accent-primary-container cursor-pointer" id="accept-terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="accept-terms">Concordo com os <a class="text-secondary font-label-md text-label-md underline" href="#">Termos</a> e a <a class="text-secondary font-label-md text-label-md underline" href="#">Política de Privacidade</a> de Moçambique.</label>
</div>
<!-- Botão principal -->
<button class="w-full mt-2 py-3.5 px-4 bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center space-x-2 shadow-md active:scale-[0.99] transition-transform duration-150" id="submit-cta" type="submit">
<span id="submit-cta-text">Entrar na Conta</span>
<div class="w-6 h-6 rounded-full bg-on-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-primary">arrow_forward</span>
</div>
</button>
</form>
<!-- Separador -->
<div class="relative py-2 flex items-center justify-center">
<div class="w-full h-px bg-surface-container-high absolute"></div>
<span class="relative px-3 bg-surface-container-lowest font-label-sm text-label-sm uppercase tracking-wider text-outline">ou continuar com</span>
</div>
<!-- Autenticação social -->
<div class="grid grid-cols-2 gap-3">
<button class="w-full flex items-center justify-center py-2.5 px-3 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors" type="button">
<svg class="w-4 h-4 mr-2" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="w-full flex items-center justify-center py-2.5 px-3 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors" type="button">
<svg class="w-4 h-4 mr-2 text-on-surface fill-current" viewBox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.62 1.35-.57.65-1.06 1.72-.93 2.74 1 .08 2.01-.49 2.62-1.24z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Alternar modo (rodapé) -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant" id="footer-helper-text">
Ainda não tem conta?
<button class="font-label-lg text-label-lg text-secondary underline ml-1 cursor-pointer" onclick="switchAuthMode('register')" type="button">Registe-se gratuitamente</button>
</p>
</div>
<!-- Faixa de feedback -->
<div class="hidden mt-4 p-3 bg-secondary-fixed text-on-secondary-fixed rounded-xl text-center font-label-md text-label-md transition-all" id="auth-alert">Sucesso! A preparar o seu ambiente de trabalho...</div>
</div>
<script>
  let currentAuthMode = 'login';

  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldNameContainer = document.getElementById('field-name-container');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const rememberRow = document.getElementById('remember-row');
    const termsRow = document.getElementById('terms-row');
    const submitCtaText = document.getElementById('submit-cta-text');
    const footerHelper = document.getElementById('footer-helper-text');

    if (mode === 'login') {
      tabLogin.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center z-10 bg-primary-container text-on-primary shadow-sm';
      tabRegister.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center z-10 text-on-surface-variant hover:text-on-surface';
      fieldNameContainer.classList.add('hidden');
      forgotPasswordLink.classList.remove('hidden');
      rememberRow.classList.remove('hidden');
      termsRow.classList.add('hidden');
      termsRow.classList.remove('flex');
      submitCtaText.textContent = 'Entrar na Conta';
      footerHelper.innerHTML = 'Ainda não tem conta? <button type="button" onclick="switchAuthMode(\'register\')" class="font-label-lg text-label-lg text-secondary underline ml-1 cursor-pointer">Registe-se gratuitamente</button>';
    } else {
      tabRegister.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center z-10 bg-primary-container text-on-primary shadow-sm';
      tabLogin.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center z-10 text-on-surface-variant hover:text-on-surface';
      fieldNameContainer.classList.remove('hidden');
      forgotPasswordLink.classList.add('hidden');
      rememberRow.classList.add('hidden');
      termsRow.classList.remove('hidden');
      termsRow.classList.add('flex');
      submitCtaText.textContent = 'Criar Nova Conta';
      footerHelper.innerHTML = 'Já possui uma conta? <button type="button" onclick="switchAuthMode(\'login\')" class="font-label-lg text-label-lg text-secondary underline ml-1 cursor-pointer">Iniciar sessão</button>';
    }
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('field-password');
    const eyeIcon = document.getElementById('eye-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleAuthSubmit(event) {
    event.preventDefault();
    const alertBox = document.getElementById('auth-alert');
    if (currentAuthMode === 'login') {
      alertBox.textContent = 'A autenticar... Bem-vindo de volta ao ProjetoEmDia!';
    } else {
      alertBox.textContent = 'Conta criada com sucesso! A carregar projectos...';
    }
    alertBox.classList.remove('hidden');
    setTimeout(() => {
      alertBox.classList.add('hidden');
    }, 3500);
  }
</script></main></body></html>
